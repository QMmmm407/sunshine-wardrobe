<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felix 韩系造型索引</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F2C6C2'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' font-weight='600' text-anchor='middle' fill='%233A3A3A'%3EF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
  :root{
    --bg:#FAF8F5; --card:#FFFFFF; --oat:#EDE6DB;
    --mist-pink:#F2C6C2; --mist-pink-deep:#E5B4AD; --mist-blue:#B8C8D6; --sage:#A8BFA0;
    --ink:#3A3A3A; --ink-2:#5A5147; --muted:#A99B8C; --line:#EDE4D8; --field:#F3EEE8;
    --shadow:0 8px 24px rgba(150,130,105,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-weight:300;
    min-height:100vh;overflow-x:hidden;
  }
  .bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 45% 35% at 12% 8%, rgba(242,198,194,.10), transparent 65%),
      radial-gradient(ellipse 40% 32% at 88% 20%, rgba(184,200,214,.12), transparent 65%),
      radial-gradient(ellipse 55% 40% at 50% 112%, rgba(237,230,219,.5), transparent 70%);
  }
  .wrap{position:relative;z-index:2;max-width:960px;margin:0 auto;padding:26px 18px 44px;}

  /* ===== 顶栏 ===== */
  header{text-align:center;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:32px;}
  .logo b{
    font-family:'Noto Serif SC','Georgia','Times New Roman',serif;
    font-size:20px;font-weight:400;letter-spacing:.42em;color:var(--ink);
  }
  .logo span{display:inline-block;margin-left:.42em;font-size:11px;letter-spacing:.32em;color:var(--muted);}
  .tag{position:absolute;top:26px;right:18px;font-size:11px;letter-spacing:.28em;color:var(--muted);display:flex;align-items:center;gap:7px;}
  .tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mist-pink);display:inline-block;}
  @media (max-width:560px){.tag{position:static;margin-top:14px;justify-content:center;}}

  /* ===== Hero ===== */
  .hero{text-align:center;margin-bottom:26px;}
  .hero .sticker{
    display:inline-block;font-size:11px;letter-spacing:.4em;color:var(--muted);
    padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:18px;
  }
  h1{
    font-family:'Noto Serif SC','Georgia','Times New Roman',serif;
    font-size:clamp(26px,4.6vw,40px);font-weight:300;letter-spacing:.14em;color:var(--ink);line-height:1.4;
  }
  h1 em{font-style:normal;font-weight:600;color:var(--ink-2);}
  .hero .sub{margin-top:14px;font-size:13px;letter-spacing:.18em;color:var(--muted);}
  .hero .sub b{font-weight:500;color:var(--ink-2);}

  /* ===== 搜索条 ===== */
  .searchbox{max-width:560px;margin:24px auto 0;}
  .search-inner{
    display:flex;align-items:stretch;gap:10px;
    background:var(--field);border-radius:34px;padding:6px 6px 6px 22px;
    border:1px solid var(--line);transition:box-shadow .2s,border-color .2s;
  }
  .search-inner:focus-within{border-color:var(--mist-pink);box-shadow:0 0 0 3px rgba(242,198,194,.35);}
  #kw{
    flex:1;min-width:0;background:transparent;border:none;outline:none;
    color:var(--ink);font-size:15px;font-weight:300;letter-spacing:.08em;padding:10px 0;font-family:inherit;
  }
  #kw::placeholder{color:#B9AC9B;}
  .go{
    border:none;cursor:pointer;background:var(--mist-pink);color:var(--ink);
    font-weight:400;font-size:13px;letter-spacing:.2em;padding:0 26px;border-radius:28px;
    font-family:inherit;transition:background .15s;
  }
  .go:hover{background:var(--mist-pink-deep);}
  .go:active{transform:translateY(1px);}

  /* 热门标签 chips */
  .chips{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chip{
    border:1px solid var(--line);background:var(--card);color:var(--ink-2);
    font-size:12px;letter-spacing:.08em;padding:6px 14px;border-radius:18px;cursor:pointer;
    font-family:inherit;transition:all .15s;
  }
  .chip:hover{border-color:var(--mist-pink);color:var(--ink);background:#FDF1F0;}
  .chip.on{background:var(--mist-pink);border-color:var(--mist-pink);color:var(--ink);}

  .status{
    margin:18px auto 0;display:inline-block;font-size:12px;letter-spacing:.22em;
    color:var(--ink-2);background:var(--field);border-radius:20px;padding:7px 18px;border:1px solid var(--line);
  }
  .status.warn{background:var(--mist-pink);border-color:var(--mist-pink);color:var(--ink);}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  /* ===== 舞台 ===== */
  .stage{
    margin:28px 0 10px;min-height:400px;
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow);padding:18px;display:flex;align-items:center;justify-content:center;
    flex-wrap:wrap;gap:12px;
  }
  .stage img{
    max-width:100%;max-height:400px;object-fit:contain;
    border-radius:10px;border:1px solid var(--line);
    animation:fadeUp .35s ease;
  }
  .stage.grid img{max-height:280px;flex:1 1 170px;}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;letter-spacing:.15em;line-height:2;}
  .empty-state b{color:var(--ink-2);font-weight:400;}

  /* 隐藏图集池（src 静态存在于此） */
  #pool{display:none;}

  /* ===== 衣橱 ===== */
  .wardrobe-title{display:flex;align-items:center;gap:14px;margin:26px 0 14px;font-size:12px;letter-spacing:.32em;color:var(--muted);}
  .wardrobe-title::before,.wardrobe-title::after{content:"";flex:1;height:1px;background:var(--line);}
  .wardrobe{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:9px;}
  .w-item{
    min-width:0;position:relative;background:#FDFBF8;border:1px solid var(--line);border-radius:10px;
    cursor:pointer;padding:6px;display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:transform .12s,border-color .12s;
  }
  .w-item:hover{transform:translateY(-3px);border-color:#DCCEC0;}
  .w-item.on{border-color:var(--mist-pink);}
  .w-item.on::after{
    content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;
    background:var(--sage);border:2px solid var(--card);
  }
  .w-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:6px;}
  .w-item span{
    font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:400;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  }
  .w-item.on span{color:var(--sage);}

  footer{
    margin-top:34px;text-align:center;font-size:11px;letter-spacing:.08em;
    color:var(--muted);line-height:2;border-top:1px solid var(--line);padding-top:18px;
  }
  footer b{color:var(--ink-2);font-weight:400;}

  /* 鼠标光标：小黄鸡 */
  *{cursor:url("https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/OlD4bQSM9o7JItxZYCwc6XNHnGb") 16 16, auto;}
  input,button{cursor:url("https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/OlD4bQSM9o7JItxZYCwc6XNHnGb") 16 16, pointer;}

  /* ===== 开场互动页 ===== */
  #intro{position:fixed;inset:0;z-index:999;background:#FAF8F5;display:flex;align-items:center;justify-content:center;
    transition:opacity .9s ease,transform .9s ease;}
  #intro.out{opacity:0;transform:translateY(-3%);pointer-events:none;}
  .intro-card{text-align:center;padding:24px;}
  .intro-card img{
    width:min(76vw,380px);aspect-ratio:3/4;object-fit:cover;border-radius:20px;
    box-shadow:0 24px 60px rgba(169,155,140,.28);
    animation:introUp 1.1s cubic-bezier(.22,1,.36,1) both;
  }
  .intro-line{
    font-family:"Noto Serif KR","Noto Serif SC","Songti SC",serif;font-weight:300;
    font-size:clamp(18px,3.4vw,27px);letter-spacing:.14em;color:#3A3A3A;
    margin:28px 0 6px;opacity:0;animation:introFade 1s .7s ease both;
  }
  .intro-line em{font-style:normal;color:#D99B96;}
  .intro-sub{font-size:12px;letter-spacing:.2em;color:#A99B8C;margin:0 0 22px;opacity:0;animation:introFade 1s .9s ease both;}
  .intro-start{
    padding:12px 42px;border-radius:30px;border:1px solid #F2C6C2;background:#FFFFFF;
    color:#3A3A3A;font-family:inherit;font-size:13px;letter-spacing:.3em;text-indent:.3em;
    opacity:0;animation:introFade 1s 1.2s ease both;transition:background .3s,transform .3s;
  }
  .intro-start:hover{background:#F2C6C2;transform:translateY(-2px);}
  @keyframes introUp{from{opacity:0;transform:translateY(70px);}to{opacity:1;transform:none;}}
  @keyframes introFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  @media (max-width:760px){
    .wardrobe{grid-template-columns:repeat(5,minmax(0,1fr));}
    .stage{min-height:320px;}
    .stage img{max-height:300px;}
    .stage.grid img{max-height:190px;flex-basis:140px;}
  }
  @media (max-width:420px){
    .logo b{font-size:16px;letter-spacing:.3em;}
    .search-inner{padding-left:16px;}
    .go{padding:0 18px;font-size:12px;}
    .wardrobe{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
</style>
</head>
<body>
<div id="intro">
  <div class="intro-card">
    <img src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/UevwbjdUdoSxSIxp049cwsA7ngd" alt="FELIX">

<script>
(function(){
  "use strict";
  /* 开场页：点击任意处开始 */
  var introEl = document.getElementById("intro");
  function closeIntro(){
    if(!introEl) return;
    introEl.classList.add("out");
    setTimeout(function(){ if(introEl && introEl.parentNode) introEl.parentNode.removeChild(introEl); introEl=null; },950);
  }
  if(introEl){ introEl.addEventListener("click", closeIntro); }
  /* 标签体系：造型(发色/发型/服装/配饰/妆容) + 风格 + 场景 + 动作情绪；别名直接并入 tags */
  var LOOKS = [
    {id:1, num:"01", title:"sunshine", d:"19年 · 浅金棕短发 · 奶茶自拍", tags:["19年","2019","奶茶妹妹","龙宝宝","龙宝宝时期","奶茶自拍","浅金棕","奶茶金","金棕","棕发","金发","短发","黑上衣","黑色上衣","耳线","耳环","雀斑","裸妆","日常","自拍","练舞室","清新","嘟嘴","咖啡","可爱"]},
    {id:2, num:"02", title:"幸馥儿", d:"20年 godmenu 打歌 · 银灰扎染", tags:["20年","2020","godmenu","神菜","神菜单","打歌","回归","银发神菜单打歌","银白","银灰","奶奶灰","银毛","银发","卷发","短卷","蓝瞳","蓝色美瞳","美瞳","红黑扎染","扎染","马甲","项链","链条项链","戒指","浓妆","红眼妆","酷飒","舞台","后台","待机","竖拇指","点赞"]},
    {id:3, num:"03", title:"霹雳酱", d:"21年 雷震子打歌 · 浅金长发", tags:["21年","2021","雷震子","雷震子打歌","雷震子金长","雷震子mv","mv造型","白金","浅金","金发","狼尾","长发","直发","发带","鼻贴","创可贴","创口贴","choker","项圈","黑白拼色","毛衣","雀斑","街头","坏男孩","户外","街拍","自拍"]},
    {id:4, num:"04", title:"馥气", d:"22年 case 143 · 皮帽战术背心", tags:["22年","2022","case143","case 143","小女警","黑短比心","黑发","黑色短发","皮帽","空顶帽","白衬衫","战术背心","战术","胸挂","制服","走廊","室内","雀斑","淡妆","酷飒","比心","手指heart"]},
    {id:5, num:"05", title:"咏卟gi", d:"23年 梅尼耶 · 抱粉色玩偶", tags:["23年","2023","梅尼耶","金短","22年","白金","浅金","金发","中分","短发","牛仔外套","牛仔","白T","戒指","耳环","雀斑","淡妆","可爱","软","签售会","签售","粉丝见面会","活动","玩偶","粉色","抱玩偶","红砖"]},
    {id:6, num:"06", title:"boki", d:"24年 日专 · 王座写真", tags:["24年","2024","日专","王座","王子","白金","浅金","金发","长发","白西装","白色西装","西装","白衣","白衬衫","西裤","厚底靴","网纱","戒指","写真","画报","拍摄","高冷","冷感","高级","暗黑","贵族"]},
    {id:7, num:"07", title:"lix", d:"25年 庆典 · 四叶草叠链", tags:["25年","2025","庆典","萌怼脸","怼脸","正脸自拍","蓝曈","粉发","扎发","浅金","亚麻金","金发","编发","小辫","蓝瞳","蓝色美瞳","美瞳","黑上衣","多层项链","四叶草","项链","自拍","待机","日常","酷飒","室内"]},
    {id:8, num:"08", title:"菲菲xi", d:"26年 this and that · 粉蓝领带西装", tags:["26年","2026","这那","thisandthat","this and that","专辑宣传图","咖啡师西装","白金","浅金","金发","短发","黑西装","西装","白衬衫","条纹领带","粉蓝领带","领带","耳环","长条耳环","徽章","烟熏妆","复古","画报","杂志","拍摄","托头","摸头"]},
    {id:9, num:"09", title:"angel", d:"23年 宝格丽红毯 · 蝴蝶纹身", tags:["23年","2023","宝格丽","g社","g社生图","蓝发","蓝绿","薄荷蓝","薄荷绿","青绿","短发","中分","黑西装","西装","波点衬衫","唇钉","耳圈","蝴蝶","纹身","蝴蝶纹身","项链","红毯","活动","颁奖礼","成熟","酷飒"]}
  ];

  var kw = document.getElementById("kw");
  var go = document.getElementById("go");
  var box = document.getElementById("searchbox");
  var statusEl = document.getElementById("status");
  var stage = document.getElementById("stage");
  var pool = document.getElementById("pool");
  var wardrobe = document.getElementById("wardrobe");
  var chips = Array.prototype.slice.call(document.querySelectorAll(".chip"));

  /* 衣橱渲染（缩略图 src 来自 pool 静态图） */
  LOOKS.forEach(function(L){
    var it = document.createElement("div");
    it.className = "w-item";
    it.setAttribute("data-id", L.id);
    var thumb = pool.querySelector('img[data-id="'+L.id+'"]').cloneNode(true);
    thumb.alt = "造型"+L.num;
    var sp = document.createElement("span");
    sp.textContent = L.num + " " + L.title;
    it.appendChild(thumb);
    it.appendChild(sp);
    it.addEventListener("click", function(){
      kw.value = L.id;
      doSearch();
    });
    wardrobe.appendChild(it);
  });
  var wItems = Array.prototype.slice.call(document.querySelectorAll(".w-item"));

  function setStatus(t, warn){
    statusEl.textContent = t;
    statusEl.classList.toggle("warn", !!warn);
  }
  function markActive(ids){
    wItems.forEach(function(it){
      it.classList.toggle("on", ids.indexOf(parseInt(it.getAttribute("data-id"),10)) >= 0);
    });
  }
  function renderResults(ids){
    stage.innerHTML = "";
    stage.classList.toggle("grid", ids.length > 1);
    if(ids.length === 0){
      stage.classList.remove("grid");
      var e = document.createElement("div");
      e.className = "empty-state";
      e.innerHTML = "NO MATCH · 没有命中造型<br>试试：<b>金发</b> <b>西装</b> <b>自拍</b> <b>红毯</b> 或编号 1–9";
      stage.appendChild(e);
      return;
    }
    ids.forEach(function(id){
      var src = pool.querySelector('img[data-id="'+id+'"]');
      stage.appendChild(src.cloneNode(true));
    });
  }
  function doSearch(){
    chips.forEach(function(c){c.classList.remove("on");});
    var q = kw.value.trim().toLowerCase();
    if(q === ""){
      var all = LOOKS.map(function(l){return l.id;});
      renderResults(all); markActive(all); setStatus("FULL WARDROBE · "+LOOKS.length+" 造型全开"); return;
    }
    if(q === "all" || q === "全部" || q === "*"){
      var all2 = LOOKS.map(function(l){return l.id;});
      renderResults(all2); markActive(all2); setStatus("FULL WARDROBE · "+LOOKS.length+" 造型全开"); return;
    }
    var tokens = q.split(/[\s,，、.]+/).filter(Boolean);
    /* 全局 tag 词典：长词优先，用于把连写词切成多段（如 23年梅尼耶 → 23年 + 梅尼耶） */
    var ALL_TAGS = Array.from(new Set(LOOKS.flatMap(function(L){return L.tags;}))).sort(function(a,b){return b.length-a.length;});
    var ids = LOOKS.filter(function(L){
      var lowTags = L.tags.map(function(t){return t.toLowerCase();});
      return tokens.every(function(tok){
        if(/^\d+$/.test(tok)){ return L.id === parseInt(tok,10); }
        /* 连写词：词典最长前缀切分，完整切下则每段都必须命中该图（严格 AND） */
        var s = tok, parts = [];
        while(s.length){
          var hit = ALL_TAGS.find(function(t){ return s.indexOf(t.toLowerCase()) === 0; });
          if(hit){ parts.push(hit.toLowerCase()); s = s.slice(hit.length); } else break;
        }
        if(parts.join("") === tok && parts.length > 0){
          return parts.every(function(p){
            return lowTags.some(function(t){ return t === p || t.indexOf(p) === 0; });
          });
        }
        /* 切不动（英文/生僻词）：退回宽松包含 */
        return lowTags.some(function(t){ return t === tok || t.indexOf(tok) === 0 || tok.indexOf(t) >= 0; });
      });
    }).map(function(L){return L.id;});
    if(ids.length === 0){
      renderResults([]);
      markActive([]);
      setStatus("NO MATCH · 试试金发 / 西装 / 红毯", true);
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      return;
    }
    renderResults(ids);
    markActive(ids);
    if(ids.length === 1){
      var L = LOOKS.filter(function(l){return l.id===ids[0];})[0];
      setStatus("NOW SHOWING · "+L.num+" "+L.title+" · "+L.d);
    } else {
      setStatus("MATCH · 命中 "+ids.length+" 个造型");
    }
  }
  go.addEventListener("click", doSearch);
  kw.addEventListener("keydown", function(e){ if(e.key === "Enter") doSearch(); });
  chips.forEach(function(c){
    c.addEventListener("click", function(){
      kw.value = c.getAttribute("data-q");
      chips.forEach(function(x){x.classList.remove("on");});
      c.classList.add("on");
      doSearch();
    });
  });
  /* 初始：全部展示 */
  var allInit = LOOKS.map(function(l){return l.id;});
  renderResults(allInit);
  markActive(allInit);
})();
</script>
</body>
</html>
